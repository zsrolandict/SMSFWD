name: Android APK letoltes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SMSFWD APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: Rules tests
        run: npm test
      - name: Web interface and native sync
        run: npm run android:sync
      - name: APK, Android tests and lint
        working-directory: android
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk'
      - name: Downloadable Android package
        uses: actions/upload-artifact@v4
        with:
          name: SMSFWD-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Standalone demo
        run: node scripts/export-demo.mjs "$RUNNER_TEMP/SMSFWD-bemutato.html"
      - name: Downloadable demo
        uses: actions/upload-artifact@v4
        with:
          name: SMSFWD-bemutato
          path: ${{ runner.temp }}/SMSFWD-bemutato.html
          if-no-files-found: error
          retention-days: 14
